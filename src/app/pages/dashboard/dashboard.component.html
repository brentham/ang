<div class="dashboard-container">
    <!-- Stats Cards Row -->
    <div class="stats-row">
      <app-stats-card2
        *ngFor="let card of statsCards"
        [icon]="card.icon"
        [iconBg]="card.iconBg"
        [title]="card.title"
        [value]="card.value"
        [subtitle]="card.subtitle"
        >
      </app-stats-card2>
    </div>

    <!-- Charts Row -->
    <div class="charts-row">
      <app-chart-card
        class="chart-card"
        title="Daily Sales"
        subtitle="55% increase in today sales"
        chartType="line"
        chartColor="#4caf50"
        >
        <span class="update-time">updated 4 minutes ago</span>
      </app-chart-card>

      <app-chart-card
        class="chart-card"
        title="Email Subscriptions"
        subtitle="Last Campaign Performance"
        chartType="bar"
        chartColor="#ffa726">
        <span class="update-time">campaign sent 2 days ago</span>
      </app-chart-card>

      <app-chart-card
        class="chart-card"
        title="Completed Tasks"
        subtitle="Last Campaign Performance"
        chartType="line"
        chartColor="#ef5350">
        <span class="update-time">campaign sent 2 days ago</span>
      </app-chart-card>
    </div>

    <!-- Bottom Row -->
    <div class="bottom-row">
      <mat-card class="tasks-card">
        <div class="tasks-header">
          <span>Tasks:</span>
          <div class="task-filters">
            <button mat-button color="primary" selected>BUGS</button>
            <button mat-button>WEBSITE</button>
            <button mat-button>SERVER</button>
          </div>
        </div>
        <mat-card-content>
          <mat-selection-list>
            <mat-list-option *ngFor="let task of tasks">
              {{ task }}
              <div class="task-actions">
                <button mat-icon-button color="primary">
                  <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button color="warn">
                  <mat-icon>close</mat-icon>
                </button>
              </div>
            </mat-list-option>
          </mat-selection-list>
        </mat-card-content>
      </mat-card>

      <mat-card class="employees-card">
        <mat-card-header>
          <mat-card-title>Employees Stats</mat-card-title>
          <mat-card-subtitle>New employees on 15th September, 2016</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <table mat-table [dataSource]="employees">
            <ng-container matColumnDef="id">
              <th mat-header-cell *matHeaderCellDef>ID</th>
              <td mat-cell *matCellDef="let employee">{{employee.id}}</td>
            </ng-container>

            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let employee">{{employee.name}}</td>
            </ng-container>

            <ng-container matColumnDef="salary">
              <th mat-header-cell *matHeaderCellDef>Salary</th>
              <!-- <td mat-cell *matCellDef="let employee">{{employee.salary | currency}}</td> -->
            </ng-container>

            <ng-container matColumnDef="country">
              <th mat-header-cell *matHeaderCellDef>Country</th>
              <td mat-cell *matCellDef="let employee">{{employee.country}}</td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="employeeColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: employeeColumns;"></tr>
          </table>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
