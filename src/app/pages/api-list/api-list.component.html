<mat-card>
    <mat-card-header>
      <mat-card-title>API Endpoints</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        <mat-list-item *ngFor="let endpoint of endpoints" (click)="onEndpointClick(endpoint)">
          {{ endpoint }}
        </mat-list-item>
      </mat-list>
    </mat-card-content>
  </mat-card>
