<div class="container">
    <h2>Available API Endpoints</h2>
    
    <ng-container *ngIf="state$ | async as state">
      <div *ngIf="state.loading" class="loading-spinner">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <div *ngIf="state.error" class="error-message">
        {{ state.error }}
      </div>

      <div class="endpoint-grid" *ngIf="!state.loading && !state.error && state.data">
        <mat-card *ngFor="let endpoint of state.data" 
                  class="endpoint-card"
                  (click)="showEndpointDetails(endpoint)">
          <mat-card-header>
            <mat-card-title>
              <mat-chip [class]="endpoint.method.toLowerCase()">
                {{ endpoint.method }}
              </mat-chip>
              {{ endpoint.path }}
            </mat-card-title>
          </mat-card-header>
          <mat-card-content>
            <p>{{ endpoint.description || 'No description available' }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="primary">View Details</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </ng-container>
  </div>
