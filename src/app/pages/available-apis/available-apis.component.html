<div class="container">
  <h2>Available Operating Systems</h2>
  
  <ng-container *ngIf="state$ | async as state">
    <div *ngIf="state.loading" class="loading-spinner">
      <mat-spinner diameter="40"></mat-spinner>
    </div>

    <div *ngIf="state.error" class="error-message">
      {{ state.error }}
    </div>

    <table mat-table [dataSource]="state.data || []" class="mat-elevation-z8" 
           *ngIf="!state.loading && !state.error && state.data">
      <ng-container matColumnDef="username">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{element.username}} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Version </th>
        <td mat-cell *matCellDef="let element"> {{element.email}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </ng-container>
</div>
